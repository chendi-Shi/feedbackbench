[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "feedbackbench"
version = "0.1.0"
description = "Reproducible feedback and compute-budget experiments for pretrained visual robot policies"
requires-python = ">=3.12,<3.14"

[project.scripts]
feedbackbench = "embodied_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
