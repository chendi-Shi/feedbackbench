name: Unit and protocol checks
# Explicit dispatch avoids starting cloud jobs merely by publishing this
# CPU-only, zero-cloud-budget research snapshot.
on: workflow_dispatch
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 pillow matplotlib pytest ruff
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src scripts tests
      # Real policy parity/loading is separately validated with pinned local
      # checkpoints. CI does not claim to execute those integration checks.
      - run: python -m pytest tests --ignore=tests/test_policies.py --ignore=tests/test_smolvla_loading.py --junitxml=test-results.xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results-${{ matrix.os }}
          path: test-results.xml
